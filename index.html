<body>

    <div id="result" style="padding: 20px; background: #eee;">Loading...</div>
    
    <script>
        // AAPKI SHEET KA PROXY LINK
        const SHEET_ID = "2PACX-1vSTF6i1qxL8s2aZri_TdSvZUjXIVscTAqLn2GEOKNIjPjejP75dMyUyB1rg1GCD-vLpncDkfwC7_LMO";
        const PROXY_URL = `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?output=csv`)}`;

        fetch(PROXY_URL)
            .then(res => res.text())
