<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Connection</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #222; color: #fff; }
        .box { background: #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #3b82f6; }
        .error { border-left-color: #ef4444; color: #ef4444; }
        .success { border-left-color: #10b981; color: #10b981; }
        pre { background: #111; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>

    <h2>Website vs Google Sheet Connection Test</h2>
    <div id="output">Checking connection...</div>

    <script>
        // Aapki Google Sheet ka link
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSTF6i1qxL8s2aZri_TdSvZUjXIVscTAqLn2GEOKNIjPjejP75dMyUyB1rg1GCD-vLpncDkfwC7_LMO/pub?output=csv"; 

        async function testConnection() {
            const output = document.getElementById('output');
            
            try {
                output.innerHTML = "1. Link se data mangwaya ja raha hai... (Fetching data)";
                
                const response = await fetch(SHEET_URL);
                
                if (!response.ok) {
                    throw new Error(`Sheet link nahi khul rahi. Status: ${response.status}`);
                }
                
                const data = await response.text();
                
                if (!data || data.trim() === "") {
                    output.innerHTML = `<div class="box error">❌ Data khali hai! Aapne Google Sheet mein "File > Share > Publish to web" kiya hai ya nahi? Ya data delete toh nahi ho gaya?</div>`;
                    return;
                }

                // Data mil gaya
                output.innerHTML = `<div class="box success">✅ Data mil gaya! Total characters: ${data.length}</div>`;
                
                const rows = data.split('\n');
                let html = `<div class="box"><b>Total Lines:</b> ${rows.length}<br><br><b>Pehli 2 lines ka data:</b><pre>${rows[0].substring(0, 100)}...\n${rows[1] ? rows[1].substring(0, 100) : 'Khali'}...</pre></div>`;
                
                output.innerHTML += html;

            } catch (error) {
                output.innerHTML = `<div class="box error">❌ Connection Fail!<br><br><b>Error:</b> ${error.message}<br><br>Yeh error aane ke 2 matlab hain:<br>1. Aapka Google Sheet ka link code mein galat hai.<br>2. Aapne Sheet ko "Publish to web" nahi kiya hua.</div>`;
            }
        }

        window.onload = testConnection;
    </script>
</body>
</html>
