<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poetry Mart - Professional</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap');

        :root {
            --primary: #8a1c24;
            --primary-hover: #6b141b;
            --bg-color: #f8f9fa;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --card-bg: #ffffff;
            --border-color: #eaeaea;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-dark); 
            line-height: 1.6;
        }
        
        /* HEADER */
        header { 
            display: flex; align-items: center; justify-content: space-between; 
            background-color: var(--card-bg); padding: 15px 20px; 
            box-shadow: 0 2px 15px rgba(0,0,0,0.05); 
            position: sticky; top: 0; z-index: 100; 
            border-bottom: 3px solid var(--primary);
            flex-wrap: wrap; gap: 15px;
        }
        .logo { font-size: 24px; font-family: 'Amiri', serif; font-weight: 700; color: var(--primary); }
        
        .nav-tabs { display: flex; gap: 10px; }
        .nav-tabs a { 
            text-decoration: none; color: var(--text-light); font-weight: 500; 
            padding: 8px 16px; border-radius: 20px; cursor: pointer; 
            transition: 0.3s; font-size: 15px; 
        }
        .nav-tabs a.active, .nav-tabs a:hover { 
            color: white; background-color: var(--primary); 
        }

        .lang-switch { display: flex; gap: 5px; background: #f0f0f0; padding: 4px; border-radius: 20px; }
        .lang-switch button { 
            border: none; background: transparent; padding: 5px 12px; 
            border-radius: 15px; cursor: pointer; font-weight: 600; font-size: 12px; color: #555; transition: 0.3s;
        }
        .lang-switch button.active { background: var(--primary); color: white; }

        /* SEARCH BAR */
        .search-container { max-width: 800px; margin: 20px auto 0 auto; padding: 0 20px; display: none; }
        .search-box { 
            width: 100%; padding: 12px 20px; font-size: 15px; 
            border: 2px solid var(--border-color); border-radius: 30px; 
            outline: none; transition: 0.3s; font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .search-box:focus { border-color: var(--primary); box-shadow: 0 4px 15px rgba(138, 28, 36, 0.15); }

        /* CONTAINER */
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        
        /* GRID: Mobile par 1, Laptop par 2 */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; align-items: start; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; gap: 20px; } }

        /* CARD DESIGN */
        .card { 
            background: var(--card-bg); border-radius: 15px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.06); overflow: hidden; 
            border: 1px solid var(--border-color); transition: transform 0.3s;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.1); }
        
        /* SHAYAR & GHAZAL */
        .sher-content { padding: 30px 25px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; }
        .shayar-name { font-family: 'Amiri', serif; font-size: 24px; color: var(--primary); font-weight: 700; margin-bottom: 20px; }
        
        .ghazal-preview { 
            font-family: 'Noto Nastaliq Urdu', serif; font-size: 19px; 
            line-height: 2.4; color: #1a1a1a; margin-bottom: 25px; 
            max-height: 250px; overflow: hidden; position: relative;
        }
        .ghazal-preview::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0;
            height: 50px; background: linear-gradient(transparent, white);
        }

        /* ACTION BUTTONS */
        .card-actions { display: flex; justify-content: center; gap: 10px; margin-top: auto; }
        .action-btn { 
            background: transparent; border: 1px solid var(--primary); color: var(--primary); 
            padding: 8px 20px; border-radius: 25px; cursor: pointer; font-size: 14px; 
            font-weight: 600; transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .action-btn:hover { background: var(--primary); color: white; }
        .share-btn { border-color: #3498db; color: #3498db; padding: 8px 15px; }
        .share-btn:hover { background: #3498db; color: white; }

        /* BOOK PART */
        .book-content { 
            background: #fafafa; padding: 15px 25px; 
            border-top: 1px dashed var(--border-color);
            display: flex; align-items: center; gap: 15px;
        }
        .book-img { width: 60px; height: 90px; object-fit: cover; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .book-info { flex-grow: 1; }
        .book-title { font-size: 16px; font-weight: 600; color: var(--text-dark); margin-bottom: 3px; }
        .book-price { font-size: 15px; color: var(--primary); font-weight: 700; }
        .buy-btn { 
            background: var(--primary); color: white; border: none; 
            padding: 8px 15px; border-radius: 6px; font-weight: 500; cursor: pointer; 
            transition: 0.3s; font-size: 13px;
        }
        .buy-btn:hover { background: var(--primary-hover); }

        /* MODALS */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; 
            backdrop-filter: blur(4px);
        }
        .modal-content { 
            background: var(--card-bg); padding: 40px 30px; border-radius: 15px; 
            max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto; 
            position: relative; text-align: center;
        }
        .close-btn { 
            position: absolute; top: 15px; right: 15px; background: #ff4757; 
            color: white; border: none; width: 30px; height: 30px; border-radius: 50%; 
            cursor: pointer; font-weight: bold; font-size: 16px;
        }
        .modal .full-text { font-family: 'Noto Nastaliq Urdu', serif; font-size: 22px; line-height: 2.6; color: #111; }

        /* BUY MODAL SPECIFIC */
        .buy-modal-content { max-width: 400px; }
        .whatsapp-btn { 
            display: block; background: #25D366; color: white; 
            padding: 12px; border-radius: 8px; text-decoration: none; 
            font-weight: 600; font-size: 16px; margin-top: 20px; 
            transition: 0.3s;
        }
        .whatsapp-btn:hover { background: #128C7E; }

        /* LOADING */
        .loading { text-align: center; padding: 50px; font-size: 20px; color: var(--primary); font-family: 'Amiri', serif; }
        .tab-section { display: none; }
        .tab-section.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">✒️ Poetry Mart</div>
        
        <div class="nav-tabs">
            <a class="active" onclick="switchTab('books', this)" id="tab-books-btn">Poetry & Books</a>
            <a onclick="switchTab('shayar', this)" id="tab-shayar-btn">Shayar</a>
        </div>

        <div class="lang-switch">
            <button onclick="changeLang('ur')" id="btn-ur" class="active">اردو</button>
            <button onclick="changeLang('hi')" id="btn-hi">हिंदी</button>
            <button onclick="changeLang('en')" id="btn-en">EN</button>
        </div>
    </header>

    <div class="search-container" id="searchContainer">
        <input type="text" id="searchInput" class="search-box" placeholder="Shayar ka naam likhein..." onkeyup="searchShayar()">
    </div>

    <div class="container">
        <div id="loadingScreen" class="loading">Data load ho raha hai...</div>
        
        <div id="books-section" class="tab-section active">
            <div id="books-grid" class="grid"></div>
        </div>

        <div id="shayar-section" class="tab-section">
            <div id="shayar-grid" class="grid"></div>
        </div>
    </div>

    <!-- Modal for Full Ghazal -->
    <div id="ghazalModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('ghazalModal')">✕</button>
            <h3 style="color: var(--primary); margin-bottom: 20px; font-family: 'Amiri', serif;" id="modalShayarName"></h3>
            <div class="full-text" id="modalGhazalText"></div>
            <button class="action-btn" style="margin-top: 30px;" onclick="shareGhazal()">📤 Share</button>
        </div>
    </div>

    <!-- Modal for Buying Book -->
    <div id="buyModal" class="modal">
        <div class="modal-content buy-modal-content">
            <button class="close-btn" onclick="closeModal('buyModal')">✕</button>
            <h3 style="color: var(--primary); font-family: 'Amiri', serif; font-size: 24px;">Order Now</h3>
            <p style="margin-top: 10px; color: var(--text-light); font-size: 14px;">Aap yeh kitab khareedna chahte hain. Rabta karne ke liye neeche button dabayein.</p>
            <a href="#" id="whatsappBtn" target="_blank" class="whatsapp-btn">💬 WhatsApp par Rabta Karein</a>
        </div>
    </div>

    <script>
        // AAPKI GOOGLE SHEET KA LINK
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSTF6i1qxL8s2aZri_TdSvZUjXIVscTAqLn2GEOKNIjPjejP75dMyUyB1rg1GCD-vLpncDkfwC7_LMO/pub?output=csv"; 
        const WHATSAPP_NUMBER = "923226914318"; // Aapka WhatsApp Number
        
        let allData = [];
        let currentLang = 'ur';
        let currentGhazal = "";

        const translations = {
            ur: { nav1: "شاعری اور کتابیں", nav2: "شاعر", buy: "خریدیں", read: "پڑھیں", search: "شاعر کا نام لکھیں..." },
            hi: { nav1: "कविता और किताबें", nav2: "शायर", buy: "खरीदें", read: "पढ़ें", search: "शायर का नाम लिखें..." },
            en: { nav1: "Poetry & Books", nav2: "Shayar", buy: "Buy Now", read: "Read More", search: "Search Shayar..." }
        };

        // CSV Parser
        function parseCSV(text) {
            let p = '', r = [], inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') {
                    if (inQuotes && text[i+1] === '"') { p += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) { r.push(p); p = ''; }
                else if (c === '\n' && !inQuotes) { r.push(p); r.push('\n'); p = ''; }
                else { p += c; }
            }
            if(p) r.push(p);
            
            let rows = [], currentRow = [];
            for(let item of r) {
                if(item === '\n') {
                    if(currentRow.length > 0) { rows.push(currentRow); currentRow = []; }
                } else {
                    currentRow.push(item.replace(/\r/g, ''));
                }
            }
            if(currentRow.length > 0) rows.push(currentRow);
            return rows;
        }

        // Fetch Data
        async function fetchData() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                const rows = parseCSV(data);
                
                allData = [];
                for(let i = 1; i < rows.length; i++) {
                    let cols = rows[i];
                    if(!cols || cols.length < 6 || !cols[5]) continue;

                    let item = {
                        title: cols[0] ? cols[0].trim() : '',
                        price: cols[2] ? cols[2].trim() : '',
                        img: cols[3] ? cols[3].trim() : '',
                        shayar: cols[5] ? cols[5].trim() : '',
                        ghazal: cols[6] ? cols[6].trim() : ''
                    };
                    
                    if(item.shayar && item.ghazal) allData.push(item);
                }

                renderBooks();
                renderShayar();
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('books-section').classList.add('active');
                
            } catch (error) {
                document.getElementById('loadingScreen').innerText = "Data load nahi hua. Sheet check karein.";
            }
        }

        // Render Books Section
        function renderBooks() {
            const grid = document.getElementById('books-grid');
            grid.innerHTML = '';
            
            allData.forEach(item => {
                const hasBook = item.title && item.img;
                
                let bookPart = '';
                if (hasBook) {
                    bookPart = `
                        <div class="book-content">
                            <img src="${item.img}" class="book-img" onerror="this.style.display='none'">
                            <div class="book-info">
                                <div class="book-title">${item.title}</div>
                                <div class="book-price">Rs. ${item.price}</div>
                            </div>
                            <button class="buy-btn" onclick="openBuyModal('${item.title.replace(/'/g, "\\'")}')">${translations[currentLang].buy}</button>
                        </div>
                    `;
                }

                grid.innerHTML += `
                    <div class="card">
                        <div class="sher-content">
                            <div class="shayar-name">${item.shayar}</div>
                            <div class="ghazal-preview">${item.ghazal.replace(/\n/g, '<br>')}</div>
                            <div class="card-actions">
                                <button class="action-btn" onclick="openGhazalModal('${item.shayar.replace(/'/g, "\\'")}', \`${item.ghazal.replace(/`/g, '\\`')}\`)">
                                    📖 ${translations[currentLang].read}
                                </button>
                                <button class="action-btn share-btn" onclick="shareDirect('${item.shayar.replace(/'/g, "\\'")}')">📤</button>
                            </div>
                        </div>
                        ${bookPart}
                    </div>
                `;
            });
        }

        // Render Shayar Section
        function renderShayar() {
            const grid = document.getElementById('shayar-grid');
            grid.innerHTML = '';
            let uniqueShayars = new Set();

            allData.forEach(item => {
                if(!uniqueShayars.has(item.shayar)) {
                    uniqueShayars.add(item.shayar);
                    
                    let bookPart = '';
                    if (item.title && item.img) {
                        bookPart = `
                            <div class="book-content">
                                <img src="${item.img}" class="book-img">
                                <div class="book-info">
                                    <div class="book-title">${item.title}</div>
                                    <div class="book-price">Rs. ${item.price}</div>
                                </div>
                                <button class="buy-btn" onclick="openBuyModal('${item.title.replace(/'/g, "\\'")}')">${translations[currentLang].buy}</button>
                            </div>
                        `;
                    }

                    grid.innerHTML += `
                        <div class="card shayar-card" data-name="${item.shayar.toLowerCase()}">
                            <div class="sher-content">
                                <div class="shayar-name">${item.shayar}</div>
                                <div class="ghazal-preview">${item.ghazal.replace(/\n/g, '<br>')}</div>
                                <div class="card-actions">
                                    <button class="action-btn" onclick="openGhazalModal('${item.shayar.replace(/'/g, "\\'")}', \`${item.ghazal.replace(/`/g, '\\`')}\`)">
                                        📖 ${translations[currentLang].read}
                                    </button>
                                </div>
                            </div>
                            ${bookPart}
                        </div>
                    `;
                }
            });
        }

        // Tab Switching
        function switchTab(tabName, element) {
            document.querySelectorAll('.tab-section').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabName + '-section').classList.add('active');
            
            document.querySelectorAll('.nav-tabs a').forEach(a => a.classList.remove('active'));
            element.classList.add('active');

            const searchContainer = document.getElementById('searchContainer');
            searchContainer.style.display = (tabName === 'shayar') ? 'block' : 'none';
        }

        // Search
        function searchShayar() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.shayar-card').forEach(card => {
                const name = card.getAttribute('data-name');
                card.style.display = name.includes(query) ? 'flex' : 'none';
            });
        }

        // Modals
        function openGhazalModal(shayar, ghazal) {
            document.getElementById('modalShayarName').innerText = shayar;
            document.getElementById('modalGhazalText').innerHTML = ghazal.replace(/\n/g, '<br>');
            currentGhazal = ghazal;
            document.getElementById('ghazalModal').style.display = 'flex';
        }

        function openBuyModal(bookTitle) {
            const message = `Assalam o Alaikum, mujhe "${bookTitle}" khareedni hai. Baraye meharbani tafseel bata dein.`;
            document.getElementById('whatsappBtn').href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
            document.getElementById('buyModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // Share
        function shareDirect(shayar) {
            const text = `Check out poetry by ${shayar} on Poetry Mart!`;
            if (navigator.share) {
                navigator.share({ title: 'Poetry Mart', text: text, url: window.location.href });
            } else {
                alert("Link copy karein: " + window.location.href);
            }
        }

        function shareGhazal() {
            const text = `${document.getElementById('modalShayarName').innerText}:\n\n${currentGhazal}`;
            if (navigator.share) {
                navigator.share({ title: 'Poetry Mart', text: text, url: window.location.href });
            } else {
                navigator.clipboard.writeText(text);
                alert("Ghazal copy ho gayi hai!");
            }
        }

        // Language Switcher & Translation
        function changeLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-switch button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');

            document.getElementById('tab-books-btn').innerText = translations[lang].nav1;
            document.getElementById('tab-shayar-btn').innerText = translations[lang].nav2;
            document.getElementById('searchInput').placeholder = translations[lang].search;

            renderBooks();
            renderShayar();

            if(lang === 'ur') {
                fetchData(); 
            } else {
                translateAllCards(lang === 'hi' ? 'hi' : 'en');
            }
        }

        async function translateAllCards(targetLang) {
            const allPreviews = document.querySelectorAll('.ghazal-preview');
            for (let i = 0; i < allPreviews.length; i++) {
                const originalText = allData[i].ghazal;
                if(originalText) {
                    allPreviews[i].innerText = "Translating...";
                    try {
                        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ur&tl=${targetLang}&dt=t&q=${encodeURIComponent(originalText)}`);
                        const data = await res.json();
                        let translatedText = data[0].map(item => item[0]).join('');
                        allPreviews[i].innerHTML = translatedText.replace(/\n/g, '<br>');
                    } catch (e) {
                        allPreviews[i].innerHTML = originalText.replace(/\n/g, '<br>');
                    }
                }
            }
        }

        window.onload = fetchData;
    </script>
</body>
</html>
