<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheet Data Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f4f4f4; }
        .box { background: white; border-left: 5px solid #8a1c24; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; color: #8a1c24; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Data Check (Test)</h2>
    <div id="output">Loading...</div>

    <script>
        // AAPKA NAYA LINK
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSTF6i1qxL8s2aZri_TdSvZUjXIVscTAqLn2GEOKNIjPjejP75dMyUyB1rg1GCD-vLpncDkfwC7_LMO/pub?output=csv"; 

        async function testData() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                const rows = data.split('\n');
                let html = "";

                // Pehli 3 lines check karte hain
                for(let i = 0; i < 3; i++) {
                    if(!rows[i] || rows[i].trim() === '') continue;
                    
                    // Data ko columns mein todna
                    const cols = rows[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || rows[i].split(',');
                    
                    html += `<div class="box">`;
                    html += `<h3>Line ${i+1}</h3>`;
                    html += `<p><b>A (Title):</b> ${cols[0] || 'Khali'}</p>`;
                    html += `<p><b>B (Author):</b> ${cols[1] || 'Khali'}</p>`;
                    html += `<p><b>F (Shayar Name):</b> ${cols[5] || 'Khali'}</p>`;
                    html += `<p><b>G (Ghazal):</b> ${cols[6] || 'Khali'}</p>`;
                    html += `</div>`;
                }

                document.getElementById('output').innerHTML = html;

            } catch (error) {
                document.getElementById('output').innerHTML = `<p class="error">Error: ${error.message}</p>`;
            }
        }

        testData();
    </script>
</body>
</html>
