<!-- Hidden form skeleton so Netlify detects the React order form at deploy time. -->
<html>
  <body>
    <form name="book-order" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="book-order" />
      <input name="book" />
      <input name="name" />
      <input name="phone" />
      <input name="city" />
      <input name="quantity" />
      <textarea name="address"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
